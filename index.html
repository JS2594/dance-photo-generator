<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#7c52ff">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles.css">
  <title>PopShot</title>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div>
      <div class="signature">for Lisa, and only Lisa ♡</div>
      <div class="brand">PopShot<span>✦</span></div>
      
    </div>
    <div class="top-actions">
      <button class="icon-btn" id="updateBtn">🔔<i></i></button>
      <button class="icon-btn">⚙️</button>
    </div>
  </header>

  <main>
    <section class="hero-card">
      <div class="steps">
        <div class="step active"><b>1</b><span>上传照片</span></div>
        <div class="line"></div>
        <div class="step"><b>2</b><span>选择课程</span></div>
        <div class="line"></div>
        <div class="step"><b>3</b><span>生成图片</span></div>
      </div>

      <label class="dropzone">
        <input type="file" id="photoInput" accept="image/*">
        <div class="upload-icon">⇧</div>
        <strong>上传今天的合照</strong>
        <span>JPG / PNG · 自动裁切至 2525 × 1894</span>
      </label>

      <div class="section-title">选择课程</div>
      <div class="courses" id="courseGrid">
        <button data-course="lelepop"><span>Lelepop</span><small>DANCE</small></button>
        <button data-course="buttscaler"><span>Buttscaler</span><small>GLUTE & LEG</small></button>
        <button data-course="zumba" class="active"><span>ZUMBA</span><small>DANCE</small></button>
        <button data-course="zumba-camp"><span>ZUMBA CAMP</span><small>BREAKDOWN CLASS</small></button>
      </div>

      <div class="quick-row">
        <div class="quick-label">
          <span>自然美化</span>
          <small id="beautyText">自然</small>
        </div>
        <div class="seg">
          <button data-beauty="0">原图</button>
          <button data-beauty="38" class="on">自然</button>
          <button data-beauty="65">活力</button>
        </div>
      </div>

      <button class="cta" id="generateBtn">✦ 一键生成</button>
    </section>

    <section class="result-card">
      <div class="result-head">
        <div>
          <b>生成结果</b>
          <small>2525 × 1894 px · 高清导出</small>
        </div>
        <button class="ghost" id="shuffleBtn">↻ 换一版</button>
      </div>

      <div class="canvas-stage">
        <canvas id="canvas" width="2525" height="1894"></canvas>
        <div class="canvas-placeholder" id="placeholder">
          <span>上传照片后，这里会显示成片</span>
        </div>
      </div>

      <div class="tools">
        <button id="changeCharacterBtn"><span>☺</span><b>换人物</b></button>
        <button id="changeTagBtn"><span>T</span><b>换标题</b></button>
        <button id="changeStickerBtn"><span>♡</span><b>换贴纸</b></button>
        <button id="changeFrameBtn"><span>▣</span><b>换相框</b></button>
        <button id="beautyBtn"><span>☼</span><b>美化</b></button>
        <button id="layoutBtn"><span>⌗</span><b>布局</b></button>
      </div>

      
      <div class="manual-edit" id="manualEdit">
        <div class="manual-hint">点选画面中的人物 / 标题 / 贴纸 / Logo 后，可拖动位置并调整大小</div>
        <div class="manual-actions">
          <button id="smallerBtn">－ 缩小</button>
          <button id="largerBtn">＋ 放大</button>
          <button id="resetLayerBtn">↺ 重置当前</button>
          <button id="resetAllBtn">重置全部</button>
        </div>
      </div>
<button class="save-btn" id="exportBtn">↓ 保存高清图片</button>
    </section>

    <section class="drawer" id="drawer">
      <div class="drawer-head"><b id="drawerTitle">快捷调整</b><button id="drawerClose">×</button></div>
      <div id="drawerBody"></div>
    </section>
  </main>

  <footer>
    <div><b>✦ 一键生成</b><span>上传就能出图</span></div>
    <div><b>☼ 自动美化</b><span>自然提亮与调色</span></div>
    <div><b>♡ 丰富素材</b><span>人物 / 标题 / 相框 / 贴纸</span></div>
    <div><b>⌁ 本地处理</b><span>照片不会上传服务器</span></div>
  </footer>

  <div class="toast hidden" id="updateTip">✨ 素材库有更新 <button id="closeUpdateTip">知道了</button></div>
</div>
<script src="./app.js"></script>
</body>
</html>
